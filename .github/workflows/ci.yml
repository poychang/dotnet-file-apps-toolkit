name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: npm ci

      - run: npm run lint
      - run: npm run check-types
      - run: npm run test:unit

      - name: Run VS Code integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Run VS Code integration tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:integration

      - run: npm run vsix
      - run: npx vsce ls

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-file-apps-toolkit-${{ matrix.os }}
          path: '*.vsix'
          if-no-files-found: error
